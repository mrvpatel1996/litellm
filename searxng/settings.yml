# SearXNG Settings for LiteLLM Enterprise
# https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  instance_name: "LiteLLM Enterprise Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "litellm-enterprise-searxng-secret"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false
