# ── LiteLLM Enterprise — Production Docker Compose for Coolify ──
#
# This compose file is designed for Coolify deployment.
# All secrets come from environment variables (set in Coolify dashboard).
# Coolify will automatically provision SSL via Let's Encrypt for your domains.
#
# Required Environment Variables (set in Coolify):
#   LITELLM_MASTER_KEY     — sk-xxx (generate: openssl rand -hex 32)
#   OPENROUTER_API_KEY     — sk-or-xxx (from openrouter.ai)
#   DATABASE_URL           — postgresql://litellm:PASSWORD@db:5432/litellm
#   UI_USERNAME            — admin
#   UI_PASSWORD            — strong password
#   LANGFUSE_NEXTAUTH_URL  — https://langfuse.yourdomain.com
#   LANGFUSE_DOCKER_URL    — http://langfuse-web:3000
#   See env.coolify.example for full list
#
# Services exposed via Coolify domains:
#   LiteLLM UI/API    → https://litellm.yourdomain.com     (port 4000)
#   Langfuse UI       → https://langfuse.yourdomain.com    (port 3000)
#   SearXNG Search    → https://search.yourdomain.com      (port 8080)
#   MinIO Console     → https://minio.yourdomain.com       (port 9001)

services:

  # =============================================
  #  LiteLLM Enterprise Proxy
  # =============================================
  litellm:
    image: ghcr.io/mrvpatel1996/litellm-enterprise:latest
    build:
      context: .
      dockerfile: Dockerfile.enterprise
    container_name: litellm-enterprise
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://litellm:${DB_PASSWORD:-litellm123}@db:5432/litellm"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      UI_USERNAME: "${UI_USERNAME:-admin}"
      UI_PASSWORD: "${UI_PASSWORD}"
      STORE_MODEL_IN_DB: "True"
      QDRANT_VECTOR_SIZE: "384"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"
      LANGFUSE_HOST: "http://langfuse-web:3000"
      LANGFUSE_RELEASE: "litellm-enterprise"
      SEARXNG_API_BASE: "http://searxng:8080"
      ROOT_REDIRECT_URL: "/ui"
      DOCS_URL: "/docs"
    volumes:
      - ./config.coolify.yaml:/app/config.local.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # =============================================
  #  PostgreSQL for LiteLLM
  # =============================================
  db:
    image: postgres:16-alpine
    container_name: litellm-enterprise-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${DB_PASSWORD:-litellm123}"
    volumes:
      - litellm_enterprise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =============================================
  #  Qdrant — Vector Store + Semantic Cache
  # =============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: litellm-enterprise-qdrant
    restart: unless-stopped
    volumes:
      - litellm_enterprise_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/self/status | head -1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # =============================================
  #  SearXNG — Privacy-Friendly Metasearch Engine
  # =============================================
  searxng:
    image: searxng/searxng:latest
    container_name: litellm-enterprise-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://localhost:8080}"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-litellm-enterprise-searxng-secret}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/search?q=test&format=json || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # =============================================
  #  Langfuse Web (UI + API)
  # =============================================
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: litellm-enterprise-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: "${LANGFUSE_NEXTAUTH_URL}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET}"
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse123}@langfuse-db:5432/langfuse"
      SALT: "${LANGFUSE_SALT}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY}"
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://clickhouse:9000"
      CLICKHOUSE_USER: "clickhouse"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-clickhouse}"
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_AUTH: "${REDIS_PASSWORD:-myredissecret}"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "auto"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "minio"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "${MINIO_PASSWORD:-miniosecret}"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: "events/"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: "auto"
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: "minio"
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "${MINIO_PASSWORD:-miniosecret}"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: "http://minio:9000"
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: "media/"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://$(cat /etc/hostname):3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =============================================
  #  Langfuse Worker (async event processing)
  # =============================================
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: litellm-enterprise-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *langfuse-env

  # =============================================
  #  ClickHouse (OLAP for Langfuse analytics)
  # =============================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: litellm-enterprise-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: "clickhouse"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-clickhouse}"
    volumes:
      - litellm_enterprise_clickhouse:/var/lib/clickhouse
      - litellm_enterprise_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # =============================================
  #  Redis (cache + queue for Langfuse)
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: litellm-enterprise-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-myredissecret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-myredissecret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =============================================
  #  MinIO (S3-compatible storage for Langfuse)
  # =============================================
  minio:
    image: minio/minio:latest
    container_name: litellm-enterprise-minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-miniosecret}"
    volumes:
      - litellm_enterprise_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  #  PostgreSQL for Langfuse
  # =============================================
  langfuse-db:
    image: postgres:16-alpine
    container_name: litellm-enterprise-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_DB_PASSWORD:-langfuse123}"
    volumes:
      - litellm_enterprise_langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d langfuse -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  litellm_enterprise_pgdata:
  litellm_enterprise_qdrant:
  litellm_enterprise_langfuse_pgdata:
  litellm_enterprise_clickhouse:
  litellm_enterprise_clickhouse_logs:
  litellm_enterprise_minio:
