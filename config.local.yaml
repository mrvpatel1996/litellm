# ── LiteLLM Enterprise Fork ── Local Dev Config ──
# Start: .venv/bin/python3 start_proxy.py
# Requires: PostgreSQL (localhost:5434), Qdrant (localhost:6333)

model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY

  # In-process dense embeddings via fastembed (BGE-small, 384-dim)
  - model_name: bge-small
    litellm_params:
      model: fastembed/BAAI/bge-small-en-v1.5

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  ui_access_mode: admin
  admin_username: os.environ/UI_USERNAME
  admin_password: os.environ/UI_PASSWORD
  enterprise_settings:
    enabled: true
    vectordb:
      backends:
        qdrant:
          api_base: "http://localhost:6333"
          api_key: ""
          distance: "Cosine"
          default_vector_size: 384
          text_field: "text"
      routing:
        default_backend: "qdrant"

# ─── LLM Response Caching ───────────────────────────────────
# Strategy: Qdrant semantic cache for cost savings
# - Exact prompts → instant cache hit (free!)
# - Similar prompts (≥0.8 similarity) → semantic cache hit (free!)
# - TTL: 7 days for cached responses
# - Caches: chat completions + embeddings
litellm_settings:
  cache: true
  cache_params:
    type: "qdrant-semantic"
    qdrant_api_base: "http://localhost:6333"
    qdrant_collection_name: "litellm_cache"
    qdrant_semantic_cache_embedding_model: "bge-small"
    qdrant_semantic_cache_vector_size: 384
    similarity_threshold: 0.8
    ttl: 604800  # 7 days in seconds
    supported_call_types:
      - "completion"
      - "acompletion"
      - "embedding"
      - "aembedding"
  drop_params: true
  set_verbose: false

# Register Qdrant as a vector store accessible via LiteLLM proxy
vector_store_registry:
  - vector_store_name: "countries"
    litellm_params:
      vector_store_id: "countries"
      custom_llm_provider: "qdrant"
      api_base: "http://localhost:6333"
      litellm_embedding_model: "bge-small"
      qdrant_distance: "Cosine"
      qdrant_vector_size: 384
      qdrant_text_field: "text"
